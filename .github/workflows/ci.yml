name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: SAST (bandit)
        run: bandit -r src/ -c pyproject.toml
      - name: Tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --target runtime -t vigilsiem:ci .
      - name: Image runs as non-root and passes health check
        run: |
          test "$(docker run --rm --entrypoint id vigilsiem:ci -u)" = "10001"
          docker run -d --name vigil -e VIGIL_JWT_SECRET="$(openssl rand -base64 48)" \
            -p 127.0.0.1:8000:8000 vigilsiem:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/healthz && break || sleep 1
          done
          curl -sI http://127.0.0.1:8000/healthz | tee /dev/stderr | grep -qi '^server:' && exit 1 || true
          docker logs vigil
