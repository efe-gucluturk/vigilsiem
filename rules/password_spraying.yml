id: VSR-1002
name: Password Spraying
description: One source IP failing logins against four or more distinct usernames.
severity: high
mitre:
  tactic: Credential Access
  technique_id: T1110.003
  technique: Password Spraying
type: distinct
match:
  - {field: event_category, equals: authentication}
  - {field: status, equals: failure}
group_by: source_ip
distinct_field: username
window_seconds: 300
threshold: 4
