id: VSR-2001
name: SQL Injection Probe
description: SQL injection syntax in a request URI (URL-decoded up to two rounds).
severity: high
mitre:
  tactic: Initial Access
  technique_id: T1190
  technique: Exploit Public-Facing Application
type: signature
match:
  - field: metadata.uri
    regex_any:
      - '\bunion\b.{0,40}\bselect\b'
      - '\bselect\b.{0,60}\bfrom\b'
      - '''\s{0,5}or\s{1,5}[\w'']{1,20}\s{0,5}='
      - '\bsleep\s{0,3}\(\s{0,3}\d'
      - '\bbenchmark\s{0,3}\('
      - 'information_schema'
      - ';\s{0,3}drop\s{1,3}table'
      - '\bxp_cmdshell\b'
group_by: source_ip
dedupe_seconds: 60
