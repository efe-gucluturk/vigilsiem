id: VSR-2002
name: Cross-Site Scripting Attempt
description: Script injection markers in a request URI.
severity: medium
mitre:
  tactic: Initial Access
  technique_id: T1190
  technique: Exploit Public-Facing Application
type: signature
match:
  - field: metadata.uri
    regex_any:
      - '<\s{0,3}script'
      - 'javascript\s{0,3}:'
      - '\bon(?:error|load|click|mouseover)\s{0,3}='
      - '<\s{0,3}(?:img|svg)[^>]{0,100}\bon(?:error|load)'
group_by: source_ip
dedupe_seconds: 60
